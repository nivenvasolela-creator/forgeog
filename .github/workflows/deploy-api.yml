name: Deploy API

# Deploys the Supabase Edge Function in supabase/functions/analyze whenever
# its code changes on main. Needs one repository secret,
# SUPABASE_ACCESS_TOKEN: a personal access token from
# https://supabase.com/dashboard/account/tokens
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bypsmyxdewspfgncbrnp
    steps:
      - name: Check the deploy token is set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::Add a SUPABASE_ACCESS_TOKEN repository secret (Settings > Secrets and variables > Actions). Create the token at https://supabase.com/dashboard/account/tokens"
          exit 1
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the function
        run: deno check supabase/functions/analyze/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        # The function checks sign-in itself (config.toml sets verify_jwt = false).
        run: supabase functions deploy analyze --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Check the live API answers
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/analyze" | grep -q '"ok":true'; then
              echo "API is up"; exit 0
            fi
            sleep 10
          done
          echo "::error::The deployed API did not answer its health check"; exit 1
