name: Deploy site

# Builds the FORGE web app and publishes it to GitHub Pages (gh-pages branch).
# The API runs separately as the Supabase Edge Function in supabase/functions.
on:
  push:
    branches: [main, claude/brave-turing-m8gy82]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # All three values are public by design: the URL of the API, the
          # Supabase project URL, and its publishable (browser) key.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: https://bypsmyxdewspfgncbrnp.supabase.co/functions/v1/analyze
          VITE_SUPABASE_URL: https://bypsmyxdewspfgncbrnp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Bj3jHMbyEbSrguxSPXP7CA_btcNmnEh
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
